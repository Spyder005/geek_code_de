# This is a Declarative Automation Bundle definition for project_bundle3.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_bundle3
  uuid: 2a5ab2c4-aa56-422d-8492-c83def705857

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-38458abb-3172.cloud.databricks.com
    variables:
      catalog: geek_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-38458abb-3172.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/phoneusemanas@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/phoneusemanas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: geek_dev
      schema: prod
    permissions:
      - user_name: phoneusemanas@gmail.com
        level: CAN_MANAGE
