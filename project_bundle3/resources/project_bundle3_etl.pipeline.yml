# The main pipeline for project_bundle3

resources:
  pipelines:
    project_bundle3_etl:
      name: project_bundle3_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/DLT Pipelines/Bronze_Silver"

      libraries:
        - glob:
            include: "../src/DLT Pipelines/Bronze_Silver/transformations/**"

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
